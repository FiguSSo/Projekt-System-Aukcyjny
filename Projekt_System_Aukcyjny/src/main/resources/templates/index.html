<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aukcje</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; }
        form { display: grid; gap: 12px; margin-bottom: 30px; }
        input, textarea, select, button { padding: 10px; font: inherit; }
        .error { color: #b91c1c; font-size: 14px; }
        .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    </style>
</head>
<body>
<h1>System aukcyjny</h1>

<h2>Dodaj nową aukcję</h2>
<form th:action="@{/auctions}" th:object="${auctionForm}" method="post">
    <div>
        <label for="title">Tytuł</label><br>
        <input id="title" type="text" th:field="*{title}" required>
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>

    <div>
        <label for="description">Opis</label><br>
        <textarea id="description" th:field="*{description}" required></textarea>
        <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>

    <div>
        <label for="startingPrice">Cena startowa</label><br>
        <input id="startingPrice" type="number" min="0.01" step="0.01" th:field="*{startingPrice}" required>
        <div class="error" th:if="${#fields.hasErrors('startingPrice')}" th:errors="*{startingPrice}"></div>
    </div>

    <div>
        <label for="category">Kategoria</label><br>
        <select id="category" th:field="*{category}" required>
            <option value="">-- wybierz kategorię --</option>
            <option value="ELECTRONICS">ELECTRONICS</option>
            <option value="CARS">CARS</option>
            <option value="SPORT">SPORT</option>
            <option value="HOME">HOME</option>
            <option value="OTHERS">OTHERS</option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
    </div>

    <div>
        <label for="startDate">Data rozpoczęcia</label><br>
        <input id="startDate" type="datetime-local" th:field="*{startDate}" required>
        <div class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
    </div>

    <div>
        <label for="endDate">Data zakończenia</label><br>
        <input id="endDate" type="datetime-local" th:field="*{endDate}" required>
        <div class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
    </div>

    <button type="submit">Dodaj aukcję</button>
</form>

<h2>Lista aukcji</h2>

<div th:if="${#lists.isEmpty(auctions)}">Brak aukcji.</div>

<div class="card" th:each="auction : ${auctions}">
    <h3 th:text="${auction.title}">Tytuł</h3>
    <p th:text="${auction.description}">Opis</p>
    <p>Cena startowa: <span th:text="${auction.startingPrice}">0.00</span></p>
    <p>Kategoria: <span th:text="${auction.category}">CATEGORY</span></p>
    <p>Status: <span th:text="${auction.status}">ACTIVE</span></p>
    <p>Start: <span th:text="${auction.startDate}">2026-01-01T10:00</span></p>
    <p>Koniec: <span th:text="${auction.endDate}">2026-01-02T10:00</span></p>
</div>
</body>
</html>
